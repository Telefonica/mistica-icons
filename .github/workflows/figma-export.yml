name: 🚀 Release (Figma)

on:
  workflow_dispatch:
    inputs:
      brand:
        type: choice
        description: Library to export
        required: true
        default: "all"
        options:
          - all
          - telefonica
          - o2
          - o2-new
          - blau
          - vivo
      draft:
        type: boolean
        default: true
        description: Draft PR

env:
  TELEFONICA_FIGMA_ID: JXy7Y07eb0Axg0ThVRWKju
  O2_FIGMA_ID: wHTqJ7KDhGKrNSNpmMb9nW
  O2_NEW_FIGMA_ID: CjvgrHEIycSQ6exznxnFXT
  BLAU_FIGMA_ID: czemeClWRGBI8oF7caNa5m
  VIVO_FIGMA_ID: EApRpjaTyUOwW5VQU2ZqgP

  # URLs for reference
  MISTICA_ICONS_FILE_URL: https://www.figma.com/design/JXy7Y07eb0Axg0ThVRWKju/Default-Icons-Set?node-id=0-71&t=1nybaZ1fzHqRq80C-1
  O2_FILE_URL: https://www.figma.com/file/wHTqJ7KDhGKrNSNpmMb9nW/?node-id=611%3A3298
  O2_NEW_FILE_URL: https://www.figma.com/design/CjvgrHEIycSQ6exznxnFXT/O2?m=auto&node-id=4-0&t=0HBFuR3VADUhh5Zr-1
  BLAU_FILE_URL: https://www.figma.com/design/czemeClWRGBI8oF7caNa5m/Blau?node-id=0-1&node-type=canvas&t=CM2TIEBRzYVgRX5A-0
  VIVO_FILE_URL: https://www.figma.com/design/EApRpjaTyUOwW5VQU2ZqgP/Vivo?node-id=4-0&node-type=canvas&t=pnjxXOX7B7hd3BmJ-0

jobs:
  export-brand:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        brand: ["telefonica", "o2", "o2-new", "blau", "vivo"]
    if: ${{ github.event.inputs.brand == 'all' || github.event.inputs.brand == matrix.brand }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install required packages
        run: |
          npm install figma-export-icons --save
          sudo apt-get install -y librsvg2-bin libimage-exiftool-perl qpdf
          yarn global add svgo

      - name: Configure branch
        run: |
          git fetch
          if git branch -a | grep origin/import-figma-icons; then
              git checkout import-figma-icons
          else
              git checkout -b import-figma-icons
          fi

      - name: Generate icon configuration
        run: |
          FIGMA_ID=${{ env[matrix.brand | upper + '_FIGMA_ID'] }}
          sed -e 's/YOUR_PERSONAL_TOKEN/${{secrets.FIGMA_TOKEN}}/' \
              -e "s/FILE_ID/$FIGMA_ID/" \
              -e 's/ICON_FRAME/Filled/' \
              -e "s|ICON_PATH|icons/${{ matrix.brand }}/filled|g" \
              figma-export-icons.template.json > ${{ matrix.brand }}-filled.json

          sed -e 's/YOUR_PERSONAL_TOKEN/${{secrets.FIGMA_TOKEN}}/' \
              -e "s/FILE_ID/$FIGMA_ID/" \
              -e 's/ICON_FRAME/Regular/' \
              -e "s|ICON_PATH|icons/${{ matrix.brand }}/regular|g" \
              figma-export-icons.template.json > ${{ matrix.brand }}-regular.json

          sed -e 's/YOUR_PERSONAL_TOKEN/${{secrets.FIGMA_TOKEN}}/' \
              -e "s/FILE_ID/$FIGMA_ID/" \
              -e 's/ICON_FRAME/Light/' \
              -e "s|ICON_PATH|icons/${{ matrix.brand }}/light|g" \
              figma-export-icons.template.json > ${{ matrix.brand }}-light.json

      - name: Export icons
        run: |
          npm run export-${{ matrix.brand }}-filled
          npm run export-${{ matrix.brand }}-regular
          npm run export-${{ matrix.brand }}-light

      - name: Optimize icons with SVGO
        run: svgo -f icons/${{ matrix.brand }} -r -o icons/${{ matrix.brand }}

      - name: Convert icons to PDF
        run: |
          for i in $(find icons/${{ matrix.brand }} -type f -name "*.svg"); do 
            rsvg-convert -f pdf -o ${i%.*}.pdf $i; 
          done
          for i in $(find icons/${{ matrix.brand }} -type f -name "*.pdf"); do 
            exiftool -overwrite_original_in_place -all:all= $i > /dev/null 2>&1 
            qpdf --replace-input --deterministic-id $i; 
          done

      - name: Generate README
        run: sudo python3 .github/md-generator/generate_markdown.py icons

      - name: Commit and Push
        env:
          GITHUB_TOKEN: ${{ secrets.NOVUM_PRIVATE_REPOS }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Figma icons updated for ${{ matrix.brand }}"
          git push origin import-figma-icons

      - name: Create Pull-Request
        uses: repo-sync/pull-request@v2
        with:
          source_branch: import-figma-icons
          destination_branch: "production"
          pr_title: "Update ${{ matrix.brand }} icons"
          pr_body: |
            New version of icons exported for ${{ matrix.brand }}.
            - [ ] Review the updates in the [import-figma-icons](https://github.com/Telefonica/mistica-icons/tree/import-figma-icons)
          pr_draft: ${{ github.event.inputs.draft }}
          github_token: ${{ secrets.NOVUM_PRIVATE_REPOS }}
