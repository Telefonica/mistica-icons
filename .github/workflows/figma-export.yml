name: 🚀 Release (Figma)

on:
  workflow_dispatch:
    inputs:
      brand:
        type: choice
        description: Library to export
        required: true
        default: "all"
        options: [all, telefonica, o2, o2-new, blau, vivo]
      draft:
        type: boolean
        default: true
        description: Draft PR
      branch:
        type: string
        description: Branch to export icons to
        default: "import-figma-icons"
        required: false

env:
  TELEFONICA_FIGMA_ID: JXy7Y07eb0Axg0ThVRWKju
  O2_FIGMA_ID: wHTqJ7KDhGKrNSNpmMb9nW
  O2_NEW_FIGMA_ID: CjvgrHEIycSQ6exznxnFXT
  BLAU_FIGMA_ID: czemeClWRGBI8oF7caNa5m
  VIVO_FIGMA_ID: EApRpjaTyUOwW5VQU2ZqgP
  MISTICA_ICONS_FILE_URL: https://www.figma.com/design/JXy7Y07eb0Axg0ThVRWKju/Default-Icons-Set?node-id=0-71&t=1nybaZ1fzHqRq80C-1
  O2_FILE_URL: https://www.figma.com/file/wHTqJ7KDhGKrNSNpmMb9nW/?node-id=611%3A3298
  O2_NEW_FILE_URL: https://www.figma.com/design/CjvgrHEIycSQ6exznxnFXT/O2?m=auto&node-id=4-0&t=0HBFuR3VADUhh5Zr-1
  BLAU_FILE_URL: https://www.figma.com/design/czemeClWRGBI8oF7caNa5m/Blau?node-id=0-1&node-type=canvas&t=CM2TIEBRzYVgRX5A-0
  VIVO_FILE_URL: https://www.figma.com/design/EApRpjaTyUOwW5VQU2ZqgP/Vivo?node-id=4-0&node-type=canvas&t=pnjxXOX7B7hd3BmJ-0

jobs:
  export-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          npm install figma-export-icons --save
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin libimage-exiftool-perl qpdf > /dev/null
          yarn global add svgo

      - name: Checkout branch
        run: |
          git fetch
          if git ls-remote --heads origin ${{ github.event.inputs.branch }} | grep -q ${{ github.event.inputs.branch }}; then
              git checkout ${{ github.event.inputs.branch }}
          else
              git checkout -b ${{ github.event.inputs.branch }}
              git push -u origin ${{ github.event.inputs.branch }}
          fi

      - name: Generate Configs & Export
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          # Función para generar config y exportar
          export_brand() {
            local brand=$1 figma_id=$2 frame=$3 path=$4
            echo "Generating config for $brand $frame..."
            sed -e "s/YOUR_PERSONAL_TOKEN/$FIGMA_TOKEN/" \
                -e "s/FILE_ID/$figma_id/" \
                -e "s/ICON_FRAME/$frame/" \
                -e "s|ICON_PATH|$path|g" figma-export-icons.template.json > "${brand}-${frame,,}.json"
          }

          BRAND_INPUT="${{ github.event.inputs.brand }}"

          # Lógica condicional simplificada
          if [[ "$BRAND_INPUT" == "all" || "$BRAND_INPUT" == "telefonica" ]]; then
            export_brand "telefonica" "$TELEFONICA_FIGMA_ID" "Filled" "icons/telefonica/filled"
            export_brand "telefonica" "$TELEFONICA_FIGMA_ID" "Regular" "icons/telefonica/regular"
            export_brand "telefonica" "$TELEFONICA_FIGMA_ID" "Light" "icons/telefonica/light"
          fi

          if [[ "$BRAND_INPUT" == "all" || "$BRAND_INPUT" == "o2" ]]; then
            export_brand "o2" "$O2_FIGMA_ID" "Filled" "icons/o2/filled"
            export_brand "o2" "$O2_FIGMA_ID" "Regular" "icons/o2/regular"
            export_brand "o2" "$O2_FIGMA_ID" "Light" "icons/o2/light"
          fi

          if [[ "$BRAND_INPUT" == "all" || "$BRAND_INPUT" == "o2-new" ]]; then
            export_brand "o2-new" "$O2_NEW_FIGMA_ID" "Filled" "icons/o2-new/filled"
            export_brand "o2-new" "$O2_NEW_FIGMA_ID" "Regular" "icons/o2-new/regular"
            export_brand "o2-new" "$O2_NEW_FIGMA_ID" "Light" "icons/o2-new/light"
          fi

          if [[ "$BRAND_INPUT" == "all" || "$BRAND_INPUT" == "blau" ]]; then
            export_brand "blau" "$BLAU_FIGMA_ID" "Regular" "icons/blau/regular"
            export_brand "blau" "$BLAU_FIGMA_ID" "Filled" "icons/blau/filled"
          fi

          if [[ "$BRAND_INPUT" == "all" || "$BRAND_INPUT" == "vivo" ]]; then
            export_brand "vivo" "$VIVO_FIGMA_ID" "Filled" "icons/vivo-new/filled"
            export_brand "vivo" "$VIVO_FIGMA_ID" "Regular" "icons/vivo-new/regular"
            export_brand "vivo" "$VIVO_FIGMA_ID" "Light" "icons/vivo-new/light"
          fi

      - name: Optimize SVGs
        run: svgo -f icons -r -o icons

      - name: Convert to PDF
        shell: bash
        run: |
          echo "Converting SVGs to PDF..."
          export SOURCE_DATE_EPOCH=0
          find icons -type f -name "*.svg" -print0 | while IFS= read -r -d '' svg; do
            target="${svg%.*}.pdf"
            tmp_pdf=$(mktemp)
            rsvg-convert -f pdf -o "$tmp_pdf" "$svg"
            exiftool -all:all= -overwrite_original "$tmp_pdf" > /dev/null 2>&1
            qpdf --replace-input --deterministic-id --object-streams=preserve --stream-data=preserve "$tmp_pdf" > /dev/null 2>&1 || true
            touch -t 197001010000.00 "$tmp_pdf"
            if [[ -f "$target" ]] && cmp -s "$tmp_pdf" "$target"; then
              rm "$tmp_pdf"
            else
              mv "$tmp_pdf" "$target"
            fi
          done

      - name: Readme generator
        run: sudo python3 .github/md-generator/generate_markdown.py icons

      - name: Commit & Push
        env:
          GITHUB_TOKEN: ${{ secrets.NOVUM_PRIVATE_REPOS }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Figma icons updated [${{ github.event.inputs.brand }}]" && git push origin ${{ github.event.inputs.branch }})

      - name: Create Pull-Request
        uses: repo-sync/pull-request@v2
        with:
          source_branch: ${{ github.event.inputs.branch }}
          destination_branch: "production"
          pr_title: "Update Figma icons: ${{ github.event.inputs.brand }}"
          pr_body: "New version of icons exported. Brand: ${{ github.event.inputs.brand }}"
          pr_draft: ${{ github.event.inputs.draft }}
          github_token: ${{ secrets.NOVUM_PRIVATE_REPOS }}
