name: Keywords autogenerated

on:
  workflow_dispatch:
  pull_request:
    branches:
      - production
    paths:
      - "icons/**"

jobs:
  check-keywords:
    runs-on: ubuntu-latest
    outputs:
      needs-generation: ${{ steps.check.outputs.needs-generation }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.x"

      - name: Upgrade pip, setuptools, and wheel
        run: |
          pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install openai python-dotenv --use-pep517

      - name: Check if keywords generation is needed
        id: check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Run the generator in dry-run mode to check if there's work to do
          python3 -c "
          import os
          import json
          from pathlib import Path

          # Path to the main folder and JSON file
          main_folder = './icons'
          synonyms_json_file = './icons/icons-keywords.json'

          # Load existing synonyms
          if os.path.exists(synonyms_json_file):
              with open(synonyms_json_file, 'r', encoding='utf-8') as f:
                  synonyms_dictionary = json.load(f)
          else:
              synonyms_dictionary = {}

          # Function to preprocess filename
          def preprocess_filename(filename):
              return filename.replace('-filled.svg', '').replace('-light.svg', '').replace('-regular.svg', '')

          # Get all unique concepts
          concepts = set()
          for root, dirs, files in os.walk(main_folder):
              for file in files:
                  if file.endswith('.svg') and not file.startswith('.'):
                      processed_file = preprocess_filename(file)
                      concepts.add(processed_file)

          # Check for missing keywords
          missing_concepts = [concept for concept in concepts if concept not in synonyms_dictionary]

          # Check for obsolete keywords
          obsolete_concepts = [key for key in synonyms_dictionary if key not in concepts]

          if missing_concepts or obsolete_concepts:
              print(f'Found {len(missing_concepts)} missing concepts and {len(obsolete_concepts)} obsolete concepts')
              print('needs-generation=true')
              exit(0)
          else:
              print('No keywords generation needed')
              print('needs-generation=false')
              exit(0)
          " | tee /tmp/check_output.txt

          # Extract the needs-generation value
          if grep -q "needs-generation=true" /tmp/check_output.txt; then
            echo "needs-generation=true" >> $GITHUB_OUTPUT
          else
            echo "needs-generation=false" >> $GITHUB_OUTPUT
          fi

  generate-keywords:
    runs-on: ubuntu-latest
    needs: check-keywords
    if: needs.check-keywords.outputs.needs-generation == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.NOVUM_PRIVATE_REPOS }}

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.x"

      - name: Upgrade pip, setuptools, and wheel
        run: |
          pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install openai python-dotenv --use-pep517

      - name: Install prettier
        run: npm install -g prettier

      - name: Run keywords generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 .github/keywords/keywords-generator.py

      - name: Commit & Push
        env:
          GITHUB_TOKEN: ${{ secrets.NOVUM_PRIVATE_REPOS }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Icons keywords autogenerated"
          git push origin HEAD
